:root{
  --ground:#FFFFFF;--ink:#17130F;--ink2:#5E5650;--tone:#F1EEEA;--tone2:#E6E1DA;
  --sun:#FFC94D;--coral:#FF8A7A;--tang:#FFA43A;--mint:#4CC9A4;--peri:#8E9BFF;--stone:#D9D4CE;
  --sun-soft:#FFF4D6;--rose:#FFE4DF;--moon:#E8EBFF;--nane:#DDF5EC;--portakal:#FFF1E2;--sun-pale:#FFE08F;
  --on:#17130F;--on2:#4A3A12;
  --night:#0E0C0B;--night2:#1A1412;--ember:#3E1A16;--ember2:#7A2E26;--glow:#FFB4A6;--glow2:#C08A7E;
  --display:"Bebia Display",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --m:clamp(16px,3.2vw,40px);--max:1360px;--gap:clamp(88px,11vw,176px);
  --r-block:clamp(36px,4.6vw,64px);--r-card:28px;
  --fs-hero:clamp(2.5rem,12.6vw,4.5rem);--fs-h2:clamp(2.125rem,5vw,3.75rem);--fs-h3:clamp(1.375rem,2vw,1.75rem);
  --fs-body:1.125rem;--fs-small:.9375rem;
  --spring:cubic-bezier(.3,1.2,.45,1);--out:cubic-bezier(.2,.8,.2,1);
  --track:-.035em;--track-sm:-.02em;--track-big:-.045em;--lead:.96;--lead-sm:1.1;--lead-hero:.92;--lead-big:.86;--lead-word:.8;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#151210;--ink:#F4EEE8;--ink2:#B9AFA6;--tone:#231E1A;--tone2:#322B26;
  --sun-soft:#3A2F14;--rose:#3B2320;--moon:#23263F;--nane:#16332A;--portakal:#3A2816;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:400 var(--fs-body)/1.55 var(--text);-webkit-font-smoothing:antialiased;overflow-x:clip}
img,svg{display:block;max-width:100%}
img{height:auto}
h1,h2,h3,p,ul,ol,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:3px solid currentColor;outline-offset:3px;border-radius:6px}
::selection{background:var(--sun);color:var(--on)}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--m)}
.skip{position:absolute;inset-inline-start:var(--m);top:-80px;z-index:10;background:var(--ink);color:var(--ground);padding:14px 20px;border-radius:999px;font:800 1rem var(--display);text-decoration:none}
.skip:focus{top:12px}
h1,h2,h3,.display{font-family:var(--display);font-weight:900;letter-spacing:var(--track);line-height:var(--lead);text-wrap:balance}
h1,h2,h3{overflow-wrap:break-word}
h1,h2{hyphens:auto}
h2{font-size:var(--fs-h2)}
h3{font-size:var(--fs-h3);font-weight:800;letter-spacing:var(--track-sm);line-height:var(--lead-sm)}
.lede{font-size:clamp(1.125rem,1.5vw,1.375rem);line-height:1.45;max-width:34em}
.muted{color:var(--ink2)}
.small{font-size:var(--fs-small)}
.tn{font-variant-numeric:tabular-nums}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border:0;border-radius:999px;
  font:800 1.125rem/1 var(--display);letter-spacing:-.01em;text-decoration:none;cursor:pointer;white-space:nowrap;
  background:var(--ink);color:var(--ground);transition:transform .25s var(--spring),background-color .2s,color .2s}
.btn:hover{transform:scale(1.03)}
.btn:active{transform:scale(.94)}
.btn.on{background:var(--on);color:#fff}
.btn.quiet{background:var(--tone);color:var(--ink)}
.btn.white{background:#fff;color:var(--on)}
.status{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 24px;border-radius:999px;background:#fff;color:var(--on);font:800 1.125rem/1 var(--display)}
.status::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--coral)}
.status:not(.white){background:var(--tone);color:var(--ink)}
.text-link{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.text-link:hover{text-decoration-thickness:4px}


.nav{display:flex;align-items:center;gap:20px;padding-block:14px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:48px;font:900 1.75rem/1 var(--display);letter-spacing:-.035em;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px}
.nav-links{display:flex;gap:2px;margin-inline-start:auto}
.nav-links a{display:inline-flex;align-items:center;min-height:48px;padding:0 13px;border-radius:999px;font:700 1rem/1 var(--display);text-decoration:none;white-space:nowrap;transition:background-color .2s}
.nav-links a:hover{background:var(--tone)}
.nav .btn{min-height:48px;padding:0 20px;font-size:1rem}

.lang{position:relative;margin-inline-start:auto}
.nav-links+.lang{margin-inline-start:0}
.lang summary{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:999px;cursor:pointer;list-style:none;font:700 1rem/1 var(--display);white-space:nowrap;transition:background-color .2s}
.lang summary::-webkit-details-marker{display:none}
.lang summary:hover,.lang[open] summary{background:var(--tone)}
.lang .lang-list{position:absolute;z-index:5;inset-inline-end:0;top:56px;width:min(calc(100vw - 2*var(--m)),780px);padding:14px;border-radius:24px;background:var(--tone);columns:4 150px;column-gap:8px}
.lang-list li{break-inside:avoid}
.lang-list a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:14px;font-weight:600;text-decoration:none;line-height:1.2}
.lang .lang-list a:hover{background:var(--tone2)}
.lang-list a[aria-current]{font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
@media (max-width:1100px){.nav-links{display:none}.nav-links+.lang{margin-inline-start:auto}}
@media (max-width:420px){.nav{gap:8px}.nav .btn{padding:0 16px}.lang summary{padding:0 10px}}


.screen{border-radius:13.7%/6.3%;background:#fff;width:100%}
.cookie{display:block;fill:currentColor}


.hero-block{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding:clamp(28px,4.8vw,72px);padding-bottom:0;border-radius:var(--r-block);background:var(--sun);color:var(--on);overflow:hidden}
.hero-clip{position:absolute;inset:0;pointer-events:none}
.hero-clip svg{position:absolute;inset-inline-end:-34%;bottom:-16%;width:118%;color:var(--sun-pale);animation:turn 90s linear infinite}
.hero-copy{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.hero{--hero-col:calc(100vw - 2*var(--m) - 2*clamp(28px,4.8vw,72px))}
.hero h1{align-self:stretch;font-size:min(var(--fs-hero),calc(var(--hero-col)/var(--hw,6)));line-height:var(--lead-hero)}
.hero h1 span{display:block}
.js .hero h1 span{white-space:nowrap}
.hero .lede{color:var(--on2);font-weight:500;max-width:25em;text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero .fine{font-size:var(--fs-small);font-weight:600;color:var(--on2)}
.hero-shot{--w:min(66vw,290px);position:relative;width:var(--w);margin:12px auto calc(var(--w)*-.72)}
@media (min-width:760px){
  :root{--fs-hero:clamp(3rem,7.4vw,6.75rem)}
  .hero-block{grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,4vw,64px);min-height:min(76svh,56vw + 200px,720px)}
  .hero-copy{align-self:center;padding-bottom:clamp(28px,4.8vw,72px);gap:26px}
  .hero{--hero-col:calc(min(100vw,var(--max)) - 2*var(--m) - 2*clamp(28px,4.8vw,72px) - clamp(230px,25vw,350px) - clamp(0px,2vw,36px) - clamp(24px,4vw,64px))}
  .hero-shot{--w:clamp(230px,25vw,350px);margin:0;margin-inline-end:clamp(0px,2vw,36px);margin-bottom:calc(var(--w)*-.7);align-self:end}
  .hero-clip svg{inset-inline-end:-10%;bottom:auto;top:-38%;width:min(56%,740px)}
}


.today{display:grid;gap:clamp(28px,4vw,48px) clamp(40px,6vw,96px);grid-template-areas:"head" "plate" "rest"}
.today-head{grid-area:head;display:flex;flex-direction:column;gap:20px;align-self:end}
.today-rest{grid-area:rest;display:flex;flex-direction:column;gap:20px}
.plate{grid-area:plate}
.today,.family,.sum,.safe,.priv,.faq,.night-intro,.plans,.doc-grid{grid-template-columns:minmax(0,1fr)}
.today>*,.family>*,.sum>*,.safe>*,.priv>*,.faq>*,.plans>*{min-width:0}
.plate{width:100%;max-width:520px;margin-inline:auto}
.lb{position:relative;aspect-ratio:1/1;container-type:inline-size;border-radius:13%;background:var(--sun);color:var(--on);overflow:hidden;
  transition:border-radius .6s var(--spring),background-color .35s var(--out)}
.lb[data-state=feeding]{border-radius:50%;background:var(--coral)}
.lb[data-state=sleeping]{border-radius:50% 50% 13% 13%/50% 50% 13% 13%;background:var(--peri)}
.lb-deco{position:absolute;inset-inline-end:-10%;top:-10%;width:48%;color:var(--sun-pale);transition:opacity .3s}
.lb:not([data-state=awake]) .lb-deco{opacity:0}
.lb-in{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:9%;transition:opacity .16s}
.lb.swap .lb-in{opacity:0}
.lb:not([data-state=awake]) .lb-in{align-items:center;text-align:center}
.lb-state{position:relative;z-index:1;font:700 clamp(1.125rem,5.6cqw,1.75rem)/1.1 var(--display)}
.lb-big{font:900 min(clamp(4rem,34cqw,11rem),calc(80cqw/var(--bw,2.4)))/var(--lead-big) var(--display);letter-spacing:var(--track-big);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb-sub{margin-top:3cqw;font-size:clamp(.9375rem,4.2cqw,1.25rem);font-weight:500;color:var(--on2);line-height:1.3}
.lb:not([data-state=awake]) .lb-sub{color:var(--on)}
.lb-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:5cqw}
.lb:not([data-state=awake]) .lb-chips{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding-inline:10px 14px;border-radius:18px;background:#fff;color:var(--on);font-size:var(--fs-small);font-weight:600;white-space:nowrap}
.chip svg{width:16px;height:16px}
.chip.pop{animation:pop .45s var(--spring)}
.shapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:22px}

.foot-grid>div{min-width:0}
.foot-grid>div:nth-child(3){grid-column:1/-1}
.foot-grid a[href^=mailto]{white-space:nowrap}
.foot-grid a{display:inline-flex;align-items:center;min-height:44px;max-width:100%;font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.foot-grid a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.foot-end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;margin-top:44px;font-size:var(--fs-small);color:#B9AFA6}
@media (min-width:760px){.foot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.foot-grid>div:nth-child(3){grid-column:auto}}
@media (prefers-color-scheme:dark){.foot{background:var(--night)}}

.section{margin-top:var(--gap)}
.section-head{margin-bottom:clamp(28px,3.4vw,48px)}


.doc-head{margin-top:8px;padding:clamp(28px,4.8vw,72px);border-radius:var(--r-block);background:var(--c,var(--mint));color:var(--on);display:grid;gap:16px;min-height:clamp(200px,26vw,320px);align-content:end}
.doc-head.arch{border-radius:clamp(120px,22vw,320px) clamp(120px,22vw,320px) var(--r-block) var(--r-block);padding-top:clamp(72px,10vw,150px)}
.doc-head h1{font-size:clamp(2.25rem,6vw,5rem);max-width:14em}
.doc-head p{font-weight:600;max-width:40em}
.doc-grid{display:grid;gap:40px;margin-top:clamp(36px,5vw,72px)}
.toc{display:none}
.prose{max-width:33em}
.prose h2{font-size:clamp(1.5rem,2.4vw,2rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2.2em 0 .6em;scroll-margin-top:24px}
.prose>h2:first-child{margin-top:0}
.prose p{margin:0 0 1em}
.prose ul{display:grid;gap:.7em;margin:0 0 1.2em}
.prose li{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:baseline}
.prose li::before{content:"";width:10px;height:10px;border-radius:30%;background:var(--c,var(--mint));transform:translateY(-1px)}
.legal-note{padding:16px 20px;border-radius:20px;background:var(--tone);font-size:var(--fs-small)}
.prose a{font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;overflow-wrap:anywhere}
.prose a:hover{text-decoration-thickness:4px}
.prose .q p{margin:0}
.contact{display:grid;gap:20px;padding:clamp(24px,3vw,36px);border-radius:var(--r-card);background:var(--tone);justify-items:start;align-self:start}
.contact a:not(.btn){font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;overflow-wrap:anywhere}
@media (min-width:980px){
  .doc-grid{grid-template-columns:minmax(0,3fr) minmax(0,8fr);gap:clamp(40px,6vw,96px)}
  .doc-grid:has(.contact){grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
  .contact{position:sticky;top:24px}
  .toc{display:block;position:sticky;top:24px;align-self:start}
  .toc h2{font:800 1rem/1.2 var(--display);letter-spacing:0;color:var(--ink2);margin-bottom:8px}
  .toc a{display:flex;align-items:center;min-height:44px;font-weight:600;text-decoration:none;line-height:1.25}
  .toc a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
}


.solo{max-width:560px;margin-inline:auto;padding:0 var(--m) 48px}
.solo .card{padding:clamp(24px,6vw,40px);border-radius:44px;background:var(--sun);color:var(--on);display:grid;gap:12px;margin:8px 0 20px}
.solo .card h1{font-size:clamp(2rem,8.6vw,2.75rem);line-height:1}
.solo .card p{font-weight:500;color:var(--on2)}
.solo .btn{width:100%;margin-top:12px;white-space:normal;text-align:center}
.solo h2{font-size:1.375rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:32px 0 8px}
.solo ol{display:grid;gap:6px;counter-reset:n}
.solo ol li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:baseline;counter-increment:n}
.solo ol li::before{content:counter(n);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--tone);font:800 .9375rem/1 var(--display)}
.solo .note{margin-top:20px}
.solo .panel{padding:20px 24px;border-radius:var(--r-card);background:var(--tone);display:grid;gap:12px}
.solo footer{margin-top:40px;font-size:var(--fs-small);color:var(--ink2)}
.solo footer a{font-weight:600}


.js .rv{opacity:0;transform:translateY(26px)}
.js .rv.in{opacity:1;transform:none;transition:opacity .6s var(--out) var(--d,0s),transform .8s var(--out) var(--d,0s)}
.js .rv.pic.in{transition-duration:.7s,1s}

[data-sc]{--p:.5;--e:1;--c:1}
.hero-shot{translate:0 calc((var(--p) - .5) * -90px)}
.plate{scale:calc(.9 + .1 * var(--e))}
.duo>.cookie{scale:calc(.82 + .18 * var(--c))}
.duo img{opacity:calc(.2 + .8 * var(--e))}
.duo img:first-of-type{translate:calc((1 - var(--c)) * -38%) calc((var(--p) - .5) * 70px);rotate:calc((1 - var(--c)) * -9deg)}
.duo img:last-of-type{translate:calc((1 - var(--c)) * 38%) calc((var(--p) - .5) * -70px);rotate:calc((1 - var(--c)) * 9deg)}
.stage{scale:calc(.88 + .12 * var(--e))}
.stage img{translate:0 calc((.5 - var(--p)) * 26%)}
.nest{rotate:calc((var(--p) - .5) * 40deg);scale:calc(.8 + .2 * var(--e))}
.cta-word{translate:calc((1 - var(--e)) * 14%) 0}
[dir=rtl] .cta-word{translate:calc((1 - var(--e)) * -14%) 0}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes arrive{0%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:none}}
@keyframes glow{0%{background:var(--sun-soft)}100%{background:transparent}}
@keyframes rise{0%{transform:translateY(36px)}100%{transform:none}}
.hero-shot{animation:rise .9s var(--out) .15s both}
.hero-copy>*{animation:rise .7s var(--out) both}
.hero-copy>:nth-child(2){animation-delay:.07s}.hero-copy>:nth-child(3){animation-delay:.14s}.hero-copy>:nth-child(4){animation-delay:.21s}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
  .js .rv{opacity:1;transform:none}
  [data-sc],[data-sc] *{translate:none!important;scale:none!important;rotate:none!important}
  .duo img{opacity:1}
  .lb,.band,.q{transition:background-color .25s,border-radius .25s!important}
}


[data-s~=cg]{--track:-.02em;--track-sm:-.01em;--track-big:-.03em;--lead:1.04;--lead-hero:1;--lead-big:.95;--lead-word:.9}
[data-s~=tall]{--track:0em;--track-sm:0em;--track-big:0em;--lead:1.28;--lead-sm:1.35;--lead-hero:1.25;--lead-big:1.2;--lead-word:1.2}
[data-s~=tall]:not([data-s~=cjk]){--fs-h2:clamp(1.75rem,3.9vw,3.125rem)}
[data-s~=cjk]{--lead:1.2;--lead-hero:1.16;--lead-big:1.1;--lead-word:1.05}
[data-s~=tall] body{line-height:1.7}
[data-s~=tall] .btn,[data-s~=tall] .status,[data-s~=tall] .nav-links a,[data-s~=tall] .lang summary{line-height:1.3}
[data-s~=tall] .lb-big,[data-s~=tall] .feed b,[data-s~=tall] .q summary,[data-s~=tall] .band-t,[data-s~=tall] .quote p,[data-s~=tall] .acc-h,[data-s~=tall] .people b{letter-spacing:0;line-height:1.35}
[data-s~=tall] .lb-big{line-height:var(--lead-big)}
[data-s~=tall] .cta-word{padding-bottom:.12em}
:lang(ur) h1,:lang(ur) h2,:lang(ur) h3{line-height:1.7}
:lang(ur) body{line-height:2}
.js[data-s~=cjk] .acc-p:not(.open) .acc-h span{transform:none}
[dir=rtl] .cta-top svg{transform:scaleX(-1)}

.field{display:grid;gap:8px;margin-top:8px}
.field label{font-weight:700}
.field input{font:600 1.25rem/1.2 var(--text);letter-spacing:.04em;padding:16px 18px;border-radius:18px;border:2px solid var(--tone2);background:var(--ground);color:var(--ink);text-transform:uppercase;width:100%;box-sizing:border-box}
.field input:focus{outline:none;border-color:var(--ink)}
.err{font-weight:600;color:var(--ink);background:var(--tone);border-radius:16px;padding:12px 16px;margin:12px 0 0}
.viewer{width:100%;height:75vh;border:0;border-radius:20px;background:var(--tone);margin-top:16px}
.row{display:grid;gap:8px}
.solo .btn.on{background:var(--ink);color:var(--ground)}
</style>

<script>
(function () {
  var FN = "https://xpaulvsuiajcwzlahzrt.supabase.co/functions/v1/report-link";
  var T = {
    tr: {
      title: "Doktor raporu",
      lead: "Bir aile bu bakım raporunu Bebia'dan şifreli paylaştı. Sana ayrıca iletilen şifreyi yaz.",
      label: "Şifre", open: "Raporu aç", working: "Açılıyor…",
      wrong: "Şifre uymadı. Büyük-küçük harf ve tire fark etmez; yeniden dene.",
      gone: "Bu bağlantı artık açılmıyor: süresi dolmuş ya da iptal edilmiş olabilir. Aileden yenisini isteyebilirsin.",
      busy: "Kısa sürede çok deneme oldu. Birkaç dakika sonra yeniden dene.",
      offline: "Sunucuya ulaşılamadı. İnternetini kontrol edip yeniden dene.",
      readyTitle: "Rapor açıldı", readyLead: "Rapor yalnız bu tarayıcıda çözüldü. Sayfayı kapatınca buradan silinir.",
      view: "Yeni sekmede aç", download: "İndir",
      brokenTitle: "Bağlantı eksik",
      brokenLead: "Bağlantının tamamı gelmemiş olabilir. Mesajdaki bağlantıyı bütünüyle kopyalayıp yeniden aç.",
      privacy: "Bebia ve sunucusu raporu açamaz; şifre bu tarayıcıdan çıkmaz."
    },
    en: {
      title: "Doctor's report",
      lead: "A family shared this care report from Bebia, encrypted. Enter the password they gave you separately.",
      label: "Password", open: "Open report", working: "Opening…",
      wrong: "That password didn't match. Case and dashes don't matter; try again.",
      gone: "This link no longer opens: it may have expired or been revoked. You can ask the family for a new one.",
      busy: "Too many attempts in a short time. Try again in a few minutes.",
      offline: "Couldn't reach the server. Check your connection and try again.",
      readyTitle: "Report opened", readyLead: "The report was decrypted only in this browser. It's gone from here when you close the page.",
      view: "Open in a new tab", download: "Download",
      brokenTitle: "Link incomplete",
      brokenLead: "The whole link may not have come through. Copy the full link from the message and open it again.",
      privacy: "Bebia and its server can't open the report; the password never leaves this browser."
    }
  };
  var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
  var lang = String(tags[0] || "").toLowerCase().split("-")[0] === "tr" ? "tr" : "en";
  var t = T[lang];
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll("[data-t]");
  for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t[nodes[i].getAttribute("data-t")];
  function fromB64(text) {
    var s = String(text).replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  var SEPARATORS = /[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200B\u2028\u2029\u202F\u205F\u3000\uFEFF\u002D\u2010-\u2014\u2212]/g;
  function canonical(password) {
    return String(password).normalize("NFC").replace(SEPARATORS, "").toUpperCase();
  }
  function parseFragment(hash) {
    var m = /^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\.([A-Za-z0-9_-]{43})$/.exec(String(hash).replace(/^#/, ""));
    return m ? { id: m[1], secret: fromB64(m[2]) } : null;
  }
  async function openReport(subtle, id, secret, password, saltB64, iterations, blobB64) {
    var salt = fromB64(saltB64), blob = fromB64(blobB64);
    if (blob.length <= 28) throw new Error("corrupt");
    var full = new Uint8Array(secret.length + salt.length);
    full.set(secret);
    full.set(salt, secret.length);
    var base = await subtle.importKey("raw", new TextEncoder().encode(canonical(password)), "PBKDF2", false, ["deriveKey"]);
    var key = await subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: full, iterations: iterations },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12),
      additionalData: new TextEncoder().encode("report_links:" + id) }, key, blob.slice(12));
    return new Uint8Array(plain);
  }
  var link = parseFragment(location.hash);
  try {
    if (link) sessionStorage.setItem("bebia.report", location.hash);
    else link = parseFragment(sessionStorage.getItem("bebia.report") || "");
  } catch (e) {}
  if (!link || !window.crypto || !crypto.subtle) {
    document.getElementById("broken").hidden = false;
    return;
  }
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  document.getElementById("ask").hidden = false;

  var form = document.getElementById("form"), input = document.getElementById("pw"),
    go = document.getElementById("go"), msg = document.getElementById("msg");
  function say(text) { msg.textContent = text; msg.hidden = !text; }

  async function fetchPayload() {
    var res = await fetch(FN + "?id=" + encodeURIComponent(link.id),
      { method: "GET", credentials: "omit", cache: "no-store", referrerPolicy: "no-referrer" });
    if (res.status === 404) throw new Error("gone");
    if (res.status === 429) throw new Error("busy");
    if (!res.ok) throw new Error("offline");
    var body = await res.json();
    if (body.v !== 1 || body.kdf !== "pbkdf2-sha256") throw new Error("gone");
    return body;
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    if (canonical(input.value).length < 8) { say(t.wrong); return; }
    go.disabled = true;
    go.textContent = t.working;
    say("");
    try {
      var payload;
      try { payload = await fetchPayload(); } catch (e) {
        var kind = e && e.message;
        say(kind === "gone" ? t.gone : kind === "busy" ? t.busy : t.offline);
        return;
      }
      var ends = payload.expires_at;
      var pdf;
      try {
        pdf = await openReport(crypto.subtle, link.id, link.secret, input.value, payload.salt, payload.iterations, payload.blob);
      } catch (e) {
        say(t.wrong);
        input.select();
        return;
      } finally {
        payload = null;
      }
      if (ends && Date.parse(ends) <= Date.now()) { say(t.gone); return; }
      var url = URL.createObjectURL(new Blob([pdf], { type: "application/pdf" }));
      document.getElementById("view").href = url;
      document.getElementById("save").href = url;
      document.getElementById("frame").src = url;
      document.getElementById("ask").hidden = true;
      document.getElementById("done").hidden = false;
    } finally {
      go.disabled = false;
      go.textContent = t.open;
    }
  });
})();
</script>
